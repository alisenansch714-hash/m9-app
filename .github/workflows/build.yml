name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev git python3-pip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 unzip wget
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Setup Android SDK and Tools
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        
        # تحميل حزمة الأدوات الرسمية
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_temp
        
        # ضبط المسار بالطريقة الصحيحة المتوافقة مع Buildozer
        rm -rf "$SDK_DIR/cmdline-tools/latest"
        mkdir -p "$SDK_DIR/cmdline-tools/latest"
        mv /tmp/cmdtools_temp/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
        
        # إنشاء الرخص آلياً
        mkdir -p "$SDK_DIR/licenses"
        printf '%s\n' '8933bad161af4178b1185d1a37fbf41ea5269c55' 'd56f5187479451eabf01fb78af6dfcb131a6481e' > "$SDK_DIR/licenses/android-sdk-license"

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/# title = My Application/title = M9 App/' buildozer.spec
        sed -i 's/# package.name = myapp/package.name = m9app/' buildozer.spec
        sed -i 's/# package.domain = org.test/package.domain = org.m9/' buildozer.spec
        sed -i 's/# source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
        sed -i 's/source.file =/source.file = M9/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        sed -i 's/# android.api = 33/android.api = 33/' buildozer.spec
        sed -i 's/# android.min_api = 21/android.min_api = 21/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
